apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

cat > demo-app/overlays/wizard/kustomization.yaml <<'EOF'
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No namespace: here on purpose — whatever the Argo CD Application
# specifies as destination.namespace wins.

resources:
  - ../../base

replicas:
  - name: demo-app
    count: 1

patches:
  - target:
      kind: Deployment
      name: demo-app
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: ENVIRONMENT
            value: "non-prod"
