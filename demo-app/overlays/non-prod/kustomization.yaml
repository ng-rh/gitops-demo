apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-app

resources:
  - ../../base

replicas:
  - name: demo-app
    count: 1

patches:
  - target:
      kind: Deployment
      name: demo-app
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: ENVIRONMENT
            value: non-prod
          - name: COLOR
            value: "#0b6e4f"
