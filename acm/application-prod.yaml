apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app-prod
  namespace: openshift-gitops
spec:
  project: default
  source:
    repoURL: https://github.com/ng-rh/gitops-demo.git
    targetRevision: main
    path: demo-app/overlays/prod
  destination:
    name: prod-cluster
    namespace: demo-app
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/spec/containers/0/image
  # No automated block on purpose: prod stays OutOfSync until someone
  # clicks Sync. That click is the approval gate.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
